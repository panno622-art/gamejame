<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Developer Profile - The Shadow File</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="h-screen w-screen overflow-hidden bg-[#030712] text-cyan-400 flex flex-col justify-center items-center relative select-none p-6">
    
    <!-- ฟิลเตอร์ลายเส้นทีวี CRT -->
    <div class="fixed inset-0 crt-overlay z-50 pointer-events-none"></div>

    <!-- พื้นหลังโทนดำ-น้ำเงินเทคโนโลยี -->
    <div class="absolute inset-0 bg-gradient-to-br from-[#020617] via-[#0b132b] to-[#030712] z-0">
        <div class="absolute inset-0 opacity-10 bg-[linear-gradient(to_right,#00ffcc15_1px,transparent_1px),linear-gradient(to_bottom,#00ffcc15_1px,transparent_1px)] bg-[size:40px_40px]"></div>
    </div>

    <!-- กล่องแสดงรายละเอียดผู้พัฒนา -->
    <div class="relative z-10 cyber-border bg-slate-950/90 backdrop-blur-md p-8 rounded-2xl max-w-xl w-full shadow-[0_0_40px_rgba(0,255,204,0.3)] space-y-6">
        <div class="flex items-center space-x-3 border-b border-cyan-500/30 pb-4">
            <i class="fa-solid fa-terminal text-3xl text-cyan-400"></i>
            <div>
                <h2 class="text-xl font-bold tracking-wider text-white">DEVELOPER PROFILE</h2>
                <p class="text-xs text-slate-400 mono">ข้อมูลผู้สร้างและระบบเบื้องหลังเกม</p>
            </div>
        </div>

        <div class="space-y-4 text-sm text-slate-300 mono">
            <div class="bg-black/60 p-4 rounded-lg border border-cyan-500/20 space-y-2">
                <p class="text-cyan-300 font-bold flex items-center"><i class="fa-solid fa-user-shield mr-2"></i>Lead Developer & Game Designer</p>
                <p class="text-slate-400 text-xs">ผู้พัฒนาและออกแบบระบบจำลอง Shadow OS ทั้งหมด รวมถึงระบบสืบสวนคดีไซเบอร์</p>
            </div>

            <div class="bg-black/60 p-4 rounded-lg border border-cyan-500/20 space-y-2">
                <p class="text-cyan-300 font-bold flex items-center"><i class="fa-solid fa-microchip mr-2"></i>Technologies & Stack</p>
                <p class="text-slate-400 text-xs">HTML5, Tailwind CSS, JavaScript (ES6+), Web Audio API, Virtual OS Simulator Architecture</p>
            </div>
        </div>

        <!-- ปุ่มย้อนกลับไปหน้า Login -->
        <button onclick="goBackToLogin()" class="cyber-btn w-full py-3 rounded-xl font-bold tracking-widest uppercase flex items-center justify-center space-x-2 cursor-pointer">
            <a href="index.html" class="cyber-btn w-full py-3 rounded font-bold tracking-wider text-center block">เริ่มปฏิบัติการสืบสวน <i class="fa-solid fa-arrow-right ml-2"></i></a>
    </div>
            <i class="fa-solid fa-arrow-left"></i>
            <span>ย้อนกลับหน้าหลัก</span>
        </button>
    </div>

    <script src="script.js"></script>
</body>
</html>
