<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Intro Briefing - The Shadow File</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="min-h-screen bg-black flex items-center justify-center relative overflow-hidden m-0 p-0 cursor-pointer">
    <!-- ฟิลเตอร์ลายเส้นทีวี CRT -->
    <div class="fixed inset-0 crt-overlay z-50 pointer-events-none"></div>

    <!-- 🎥 ส่วนแสดงวิดีโอ (เล่นอัตโนมัติ) -->
    <div class="absolute inset-0 w-full h-full bg-black z-10 flex items-center justify-center">
        <video id="intro-video" class="w-full h-full object-cover" autoplay playsinline>
            <source src="game.mp4" type="video/mp4">
            เบราว์เซอร์ของคุณไม่รองรับการเล่นวิดีโอ
        </video>
    </div>

    <!-- ⏭️ ปุ่มข้าม (Skip Button) อยู่ขวาล่าง ตัวจางๆ -->
    <button onclick="skipVideo(event)" class="fixed bottom-6 right-6 z-40 bg-slate-900/40 hover:bg-slate-900/80 text-cyan-300/50 hover:text-cyan-300 border border-cyan-500/20 hover:border-cyan-500 px-4 py-2 rounded text-xs mono tracking-widest opacity-40 hover:opacity-100 transition-all duration-300 flex items-center space-x-2 shadow-lg">
        <span>SKIP INTRO</span>
        <i class="fa-solid fa-forward"></i>
    </button>

    <script>
        const video = document.getElementById('intro-video');

        // พยายามสั่งเล่นวิดีโอพร้อมเสียงทันทีที่เข้าหน้าเว็บ
        video.play().catch(error => {
            console.log("Browser restricted autoplay with sound:", error);
        });

        // หากเบราว์เซอร์บล็อกเสียงเริ่มต้น การคลิกเมาส์ที่หน้าจอตรงไหนก็ได้ 1 ครั้ง จะปลดล็อกเสียงและเล่นวิดีโอต่อทันที
        document.body.addEventListener('click', () => {
            if (video.paused) {
                video.play();
            }
        });

        // เมื่อวิดีโอเล่นครบความยาว (55 วินาที) จะพุ่งไปหน้า game.html อัตโนมัติ
        video.addEventListener('ended', () => {
            window.location.href = 'game.html';
        });

        // ฟังก์ชันกดปุ่มข้าม (Skip)
        function skipVideo(event) {
            event.stopPropagation(); // ป้องกันไม่ให้คลิกปุ่มข้ามแล้วไปโดนคำสั่งคลิกหน้าจอซ้ำ
            window.location.href = 'game.html';
        }
    </script>
</body>
</html>
