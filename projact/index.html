<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - The Shadow File</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="min-h-screen flex items-center justify-center relative selection:bg-cyan-500 selection:text-black">
    <div class="fixed inset-0 crt-overlay z-50"></div>

    <!-- LOADING OVERLAY (หลอดโหลด 5 วินาที) -->
    <div id="loading-overlay" class="fixed inset-0 bg-slate-950/95 z-40 flex flex-col items-center justify-center p-6 hidden transition-all duration-500 transform -translate-y-full">
        <div class="cyber-border bg-slate-900 p-8 rounded-lg max-w-md w-full text-center space-y-6 shadow-[0_0_30px_rgba(0,255,204,0.3)]">
            <div class="text-4xl text-cyan-400 animate-bounce">
                <i class="fa-solid fa-server"></i>
            </div>
            <div>
                <h3 class="text-lg font-bold text-cyan-300 tracking-wider mb-1">ACCESS GRANTED</h3>
                <p class="text-xs text-slate-400 mono">กำลังถอดรหัสและดาวน์โหลดข้อมูลแฟ้มคดี...</p>
            </div>
            <div class="space-y-2">
                <div class="w-full bg-slate-800 rounded-full h-4 overflow-hidden border border-cyan-500/50 p-0.5 shadow-[0_0_10px_#00ffcc_inset]">
                    <div id="loading-bar" class="bg-gradient-to-r from-cyan-500 to-emerald-400 h-full w-0 rounded-full transition-all duration-75 shadow-[0_0_12px_#00ffcc]"></div>
                </div>
                <div class="flex justify-between items-center text-xs mono text-cyan-400">
                    <span id="loading-status" class="animate-pulse">DECRYPTING...</span>
                    <span id="loading-percent" class="font-bold text-sm">0%</span>
                </div>
            </div>
        </div>
    </div>

    <!-- LOGIN BOX -->
    <div class="cyber-border bg-slate-900/90 p-8 rounded-lg max-w-md w-full text-center relative z-10">
        <div class="text-4xl text-cyan-400 mb-2"><i class="fa-solid fa-user-shield"></i></div>
        <h1 class="text-2xl font-bold tracking-widest text-cyan-400 mb-1">SHADOW FILE OS</h1>
        <p class="text-xs text-slate-400 mb-6 uppercase tracking-wider">ระบบฐานข้อมูลสืบสวนคดีพิเศษ</p>
        
        <div class="space-y-4 mb-6">
            <label class="block text-left text-sm text-cyan-300">กรุณาใส่รหัสผ่านระบบ (5 หลัก):</label>
            <input type="password" id="login-pass" maxlength="5" placeholder="• • • • •" class="w-full bg-black/60 border border-cyan-500/50 rounded p-3 text-center text-2xl tracking-widest text-cyan-400 mono focus:outline-none focus:border-cyan-400">
            <p id="login-error" class="text-red-500 text-xs hidden">รหัสผ่านไม่ถูกต้อง! (คำใบ้: 12345)</p>
        </div>

        <button onclick="checkLogin()" class="cyber-btn w-full py-3 rounded font-bold tracking-wider uppercase">เข้าสู่ระบบ</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
