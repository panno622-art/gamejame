<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>Project Documentation</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-950 text-slate-200 p-5 font-mono select-none">
    <h3 class="text-xs font-bold text-cyan-400 tracking-wider uppercase border-b border-slate-800 pb-2 mb-4">
        <i class="fa-solid fa-folder-open mr-2"></i>Project Directory // แฟ้มเอกสารโปรเจกต์
    </h3>
    
    <!-- ตารางแสดงรายการรูปภาพในโปรเจกต์ -->
    <div class="grid grid-cols-3 gap-4">
        

        <!-- รูปที่ 2: สามารถเพิ่มการ์ดรูปภาพอื่นๆ ต่อได้ตรงนี้ -->
        <div onclick="openImageModal('ภาพไร้คน.png', 'เอกสารโครงการ #02')" class="bg-slate-900/60 border border-slate-800 hover:border-cyan-500/50 p-3 rounded-lg flex flex-col items-center cursor-pointer group transition-all">
            <div class="w-full h-24 bg-black rounded mb-2 overflow-hidden flex items-center justify-center border border-slate-800">
                <img src="ภาพไร้คน.png" class="w-full h-full object-cover group-hover:scale-105 transition-transform" onerror="this.src='https://via.placeholder.com/150?text=Image+Not+Found'">
            </div>
            <span class="text-[11px] text-slate-300 truncate w-full text-center">สถานที่บุก</span>
            <span class="text-[9px] text-slate-500 mt-1">คลิกเพื่อดูรูปภาพ</span>
        </div>

    </div>

    <!-- Modal สำหรับขยายรูปภาพ -->
    <div id="image-modal" class="hidden fixed inset-0 bg-black/90 flex flex-col items-center justify-center p-4 z-50">
        <div class="border border-cyan-500/50 bg-slate-900 p-4 rounded-xl max-w-lg w-full flex flex-col items-center space-y-3 shadow-[0_0_30px_rgba(6,182,212,0.3)]">
            <h4 id="modal-title" class="text-xs font-bold text-cyan-300">TITLE</h4>
            <img id="modal-img" src="" class="max-h-[350px] rounded border border-cyan-500/30 object-contain bg-black">
            <button onclick="closeImageModal()" class="w-full bg-cyan-600 hover:bg-cyan-500 text-black font-bold py-2 text-xs rounded transition-colors cursor-pointer">ปิดหน้าต่าง</button>
        </div>
    </div>

    <script>
        function openImageModal(src, title) {
            document.getElementById('modal-img').src = src;
            document.getElementById('modal-title').innerText = title;
            document.getElementById('image-modal').classList.remove('hidden');
        }
        function closeImageModal() {
            document.getElementById('image-modal').classList.add('hidden');
        }
    </script>
</body>
</html>
