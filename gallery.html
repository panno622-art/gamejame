<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>Gallery Evidence</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-950 text-slate-200 p-5 font-mono select-none">
    <h3 class="text-xs font-bold text-amber-400 tracking-wider uppercase border-b border-slate-800 pb-2 mb-4">
        <i class="fa-solid fa-images mr-2"></i>Gallery // คลังรูปภาพและหลักฐาน
    </h3>
    
    <!-- ตารางแสดงรายการรูปภาพ (สามารถเพิ่มการ์ดรูปภาพอื่นๆ ได้ตามต้องการ) -->
    <div class="grid grid-cols-3 gap-4">
        
        <!-- รูปที่ 1: เปลี่ยน 'my_photo1.png' เป็นชื่อไฟล์รูปของคุณ -->
        <div onclick="openImageModal('Skibidi.png', 'หลักฐานชิ้นที่ 1: ภาพถ่ายจุดเกิดเหตุ')" class="bg-slate-900/60 border border-slate-800 hover:border-amber-500/50 p-3 rounded-lg flex flex-col items-center cursor-pointer group transition-all">
            <div class="w-full h-24 bg-black rounded mb-2 overflow-hidden flex items-center justify-center border border-slate-800">
                <img src="Skibidi.png" class="w-full h-full object-cover group-hover:scale-105 transition-transform" onerror="this.src='https://via.placeholder.com/150?text=Image+Not+Found'">
            </div>
            <span class="text-[11px] text-slate-300 truncate w-full text-center">Target</span>
            <span class="text-[9px] text-slate-500 mt-1">คลิกเพื่อขยายรูป</span>
        </div>

    </div>


 <div onclick="openImageModal('code489.png', 'หลักฐานชิ้นที่ 1: ภาพถ่ายจุดเกิดเหตุ')" class="bg-slate-900/60 border border-slate-800 hover:border-amber-500/50 p-3 rounded-lg flex flex-col items-center cursor-pointer group transition-all">
            <div class="w-full h-24 bg-black rounded mb-2 overflow-hidden flex items-center justify-center border border-slate-800">
                <img src="code489.png" class="w-full h-full object-cover group-hover:scale-105 transition-transform" onerror="this.src='https://via.placeholder.com/150?text=Image+Not+Found'">
            </div>
            <span class="text-[11px] text-slate-300 truncate w-full text-center">Codelist</span>
            <span class="text-[9px] text-slate-500 mt-1">คลิกเพื่อขยายรูป</span>
        </div>

    </div>




 <div onclick="openImageModal('การแลกเปลี่ยนลับในตรอกมืด bitstarz.png', 'หลักฐานชิ้นที่ 1: ภาพถ่ายจุดเกิดเหตุ')" class="bg-slate-900/60 border border-slate-800 hover:border-amber-500/50 p-3 rounded-lg flex flex-col items-center cursor-pointer group transition-all">
            <div class="w-full h-24 bg-black rounded mb-2 overflow-hidden flex items-center justify-center border border-slate-800">
                <img src="การแลกเปลี่ยนลับในตรอกมืด bitstarz.png" class="w-full h-full object-cover group-hover:scale-105 transition-transform" onerror="this.src='https://via.placeholder.com/150?text=Image+Not+Found'">
            </div>
            <span class="text-[11px] text-slate-300 truncate w-full text-center">sjafoiefuie</span>
            <span class="text-[9px] text-slate-500 mt-1">คลิกเพื่อขยายรูป</span>
        </div>

    </div>




    <!-- Modal สำหรับขยายรูปภาพ -->
    <div id="image-modal" class="hidden fixed inset-0 bg-black/90 flex flex-col items-center justify-center p-4 z-50">
        <div class="border border-amber-500/50 bg-slate-900 p-4 rounded-xl max-w-lg w-full flex flex-col items-center space-y-3 shadow-[0_0_30px_rgba(245,158,11,0.3)]">
            <h4 id="modal-title" class="text-xs font-bold text-amber-300">TITLE</h4>
            <img id="modal-img" src="" class="max-h-[350px] rounded border border-amber-500/30 object-contain bg-black">
            <button onclick="closeImageModal()" class="w-full bg-amber-600 hover:bg-amber-500 text-black font-bold py-2 text-xs rounded transition-colors cursor-pointer">ปิดหน้าต่าง</button>
        </div>
    </div>

    <script>
        function openImageModal(src, title) {
            document.getElementById('modal-img').src = src;
            document.getElementById('modal-title').innerText = title;
            document.getElementById('image-modal').classList.remove('hidden');
        }
        function closeImageModal() {
            document.getElementById('image-modal').classList.add('hidden');
        }
    </script>
</body>
</html>
