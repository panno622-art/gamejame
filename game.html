<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shadow OS - Cyber Investigation</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="h-screen w-screen overflow-hidden select-none relative" style="background: url('window.png') no-repeat center center fixed; background-size: cover;">
    <div class="fixed inset-0 crt-overlay z-50 pointer-events-none"></div>

    <!-- 🖥️ DESKTOP WORKSPACE (ไอคอนเต็มฝั่งซ้ายและขวา ลากย้ายได้อิสระ) -->
        
        <!-- 🖥️ DESKTOP WORKSPACE (คงไว้เฉพาะ 7 ไอคอนที่กำหนด) -->
    <div id="desktop-area" class="absolute inset-0 z-15 overflow-hidden">
        
        <!-- 👈 โซนซ้าย -->
        <div class="desktop-icon" style="top: 40px; left: 40px;" data-action="thisPC">
            <i class="fa-solid fa-computer text-slate-200 text-2xl mb-1 drop-shadow-md"></i>
            <span class="text-[11px] text-white drop-shadow font-mono">This PC</span>
        </div>

        <div class="desktop-icon" style="top: 130px; left: 40px;" data-action="explorer" data-path="documents" data-title="แฟ้มเอกสารหลัก">
            <i class="fa-solid fa-folder text-amber-400 text-2xl mb-1 drop-shadow-md"></i>
            <span class="text-[11px] text-white drop-shadow font-mono">แฟ้มเอกสาร</span>
        </div>
<!-- ไอคอน U-rias -->
        <div class="desktop-icon" style="top: 220px; left: 40px;" data-action="urias">
            <i class="fa-solid fa-globe text-blue-400 text-2xl mb-1 drop-shadow-md"></i>
            <span class="text-[11px] text-white drop-shadow font-mono">U-rias</span>
        </div>

        <!-- ไอคอน Project -->
        <div class="desktop-icon" style="top: 310px; left: 40px;" data-action="project" data-title="Project Folder">
            <i class="fa-solid fa-folder text-amber-600 text-2xl mb-1 drop-shadow-md"></i>
            <span class="text-[11px] text-white drop-shadow font-mono">Project</span>
        </div>

        <!-- ไอคอน Jing -->
        <div class="desktop-icon" style="top: 40px; right: 40px; left: auto;" data-action="jing" data-title="Jing News Portal">
            <i class="fa-solid fa-window-maximize text-indigo-400 text-2xl mb-1 drop-shadow-md"></i>
            <span class="text-[11px] text-white drop-shadow font-mono">Jing</span>
        </div>

        <!-- ไอคอน Pornhip (เรียกหน้า pornhip.html) -->
        <div class="desktop-icon" style="top: 220px; right: 40px; left: auto;" data-action="pornhip" data-title="Pornhip Dating">
            <div class="bg-amber-500 text-black font-bold px-1.5 py-0.5 rounded text-[9px] mb-1 shadow">Porn<span class="bg-black text-white px-0.5">hip</span></div>
            <span class="text-[11px] text-white drop-shadow font-mono">Pornhip</span>
        </div>
    </div>
    


    <!-- 🕒 ช่องสี่เหลี่ยมเล็กบอกเวลา มุมขวาล่างสุด -->
    <div class="fixed bottom-4 right-4 z-40 bg-slate-950/80 backdrop-blur-md border border-cyan-500/30 px-3 py-1.5 rounded-md shadow-2xl text-xs mono text-cyan-400 flex items-center space-x-2">
        <i class="fa-solid fa-clock"></i>
        <span id="os-timer">00:00</span>
    </div>

    <!-- 🪟 WINDOW TEMPLATE CONTAINER -->
    <div id="window-container" class="absolute inset-0 pointer-events-none z-30 overflow-hidden"></div>

 
    <!-- 🗂️ WINDOW TEMPLATE -->
    <template id="window-template">
        <div class="os-window absolute bg-slate-950/90 backdrop-blur-xl border border-cyan-500/30 rounded-xl shadow-[0_0_40px_rgba(0,0,0,0.8)] flex flex-col pointer-events-auto overflow-hidden" style="width: 1000px; height: 580px; top: 50px; left: 80px;">
            <div class="window-header bg-slate-900/80 p-3 px-4 flex justify-between items-center border-b border-cyan-500/20 cursor-move">
                <span class="window-title text-xs font-bold text-cyan-300 mono flex items-center">
                    <i class="fa-solid fa-folder-open mr-2 text-amber-400"></i> <span class="title-text">Window</span>
                </span>
                <div class="flex items-center space-x-3">
                    <button onclick="minimizeWindow(this)" class="text-slate-400 hover:text-white text-xs"><i class="fa-solid fa-minus"></i></button>
                    <button onclick="maximizeWindow(this)" class="text-slate-400 hover:text-white text-xs"><i class="fa-solid fa-square"></i></button>
                    <button onclick="closeWindow(this)" class="text-red-400 hover:text-red-300 text-xs"><i class="fa-solid fa-xmark"></i></button>
                </div>
            </div>
            <div class="window-toolbar bg-slate-950/60 p-2 px-4 flex items-center space-x-3 border-b border-slate-800/80 text-xs text-slate-400">
                <button class="hover:text-white"><i class="fa-solid fa-arrow-left"></i></button>
                <button class="hover:text-white"><i class="fa-solid fa-arrow-right"></i></button>
                <button class="hover:text-white"><i class="fa-solid fa-rotate-right"></i></button>
                <div class="flex-1 bg-black/40 px-3 py-1 rounded border border-slate-800 mono text-cyan-400 address-bar truncate">
                    C:\ShadowOS\System
                </div>
            </div>
            <div class="window-body flex-1 overflow-y-auto bg-[#070b14]/80 text-slate-200 mono text-sm flex"></div>
        </div>
    </template>

    <script src="script.js"></script>
</body>
</html>
