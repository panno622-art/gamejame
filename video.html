<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>Video Evidence</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-950 text-slate-200 p-5 font-mono select-none">
    <h3 class="text-xs font-bold text-purple-400 tracking-wider uppercase border-b border-slate-800 pb-2 mb-4">
        <i class="fa-solid fa-video mr-2"></i>Video Player // คลังวิดีโอลับ
    </h3>
    
    <!-- ตารางแสดงรายการวิดีโอ -->
    <div class="grid grid-cols-2 gap-4">
        
        <!-- วิดีโอที่ 1: เปลี่ยน 'my_video1.mp4' เป็นชื่อไฟล์วิดีโอของคุณ (แนะนำ .mp4) -->
        <div onclick="openVideoModal('คุยไรกัน.mp4', 'คลิปกล้องวงจรปิดห้องเซิร์ฟเวอร์')" class="bg-slate-900/60 border border-slate-800 hover:border-purple-500/50 p-3 rounded-lg flex flex-col items-center cursor-pointer group transition-all">
            <div class="w-full h-28 bg-black rounded mb-2 relative overflow-hidden flex items-center justify-center border border-slate-800">
                <i class="fa-solid fa-play text-purple-400 text-3xl z-10 group-hover:scale-110 transition-transform"></i>
                <div class="absolute inset-0 bg-purple-950/30"></div>
            </div>
            <span class="text-[11px] text-slate-300 truncate w-full text-center">----1</span>
            <span class="text-[9px] text-slate-500 mt-1">คลิกเพื่อเล่นวิดีโอ (มีเสียง)</span>
        </div>

    </div>

    <div onclick="openVideoModal('Codename.mp4', 'คลิปกล้องวงจรปิดห้องเซิร์ฟเวอร์')" class="bg-slate-900/60 border border-slate-800 hover:border-purple-500/50 p-3 rounded-lg flex flex-col items-center cursor-pointer group transition-all">
            <div class="w-full h-28 bg-black rounded mb-2 relative overflow-hidden flex items-center justify-center border border-slate-800">
                <i class="fa-solid fa-play text-purple-400 text-3xl z-10 group-hover:scale-110 transition-transform"></i>
                <div class="absolute inset-0 bg-purple-950/30"></div>
            </div>
            <span class="text-[11px] text-slate-300 truncate w-full text-center">----2</span>
            <span class="text-[9px] text-slate-500 mt-1">คลิกเพื่อเล่นวิดีโอ (มีเสียง)</span>
        </div>

    </div>

    <div onclick="openVideoModal('กูรู้นะ.mp4', 'คลิปกล้องวงจรปิดห้องเซิร์ฟเวอร์')" class="bg-slate-900/60 border border-slate-800 hover:border-purple-500/50 p-3 rounded-lg flex flex-col items-center cursor-pointer group transition-all">
            <div class="w-full h-28 bg-black rounded mb-2 relative overflow-hidden flex items-center justify-center border border-slate-800">
                <i class="fa-solid fa-play text-purple-400 text-3xl z-10 group-hover:scale-110 transition-transform"></i>
                <div class="absolute inset-0 bg-purple-950/30"></div>
            </div>
            <span class="text-[11px] text-slate-300 truncate w-full text-center">----3</span>
            <span class="text-[9px] text-slate-500 mt-1">คลิกเพื่อเล่นวิดีโอ (มีเสียง)</span>
        </div>

    </div>

    <div onclick="openVideoModal('ผุ้สงสาร.mp4', 'คลิปกล้องวงจรปิดห้องเซิร์ฟเวอร์')" class="bg-slate-900/60 border border-slate-800 hover:border-purple-500/50 p-3 rounded-lg flex flex-col items-center cursor-pointer group transition-all">
            <div class="w-full h-28 bg-black rounded mb-2 relative overflow-hidden flex items-center justify-center border border-slate-800">
                <i class="fa-solid fa-play text-purple-400 text-3xl z-10 group-hover:scale-110 transition-transform"></i>
                <div class="absolute inset-0 bg-purple-950/30"></div>
            </div>
            <span class="text-[11px] text-slate-300 truncate w-full text-center">----4</span>
            <span class="text-[9px] text-slate-500 mt-1">คลิกเพื่อเล่นวิดีโอ (มีเสียง)</span>
        </div>

    </div>

    <!-- Modal สำหรับเล่นวิดีโอพร้อมเสียง -->
    <div id="video-modal" class="hidden fixed inset-0 bg-black/95 flex flex-col items-center justify-center p-4 z-50">
        <div class="border border-purple-500/50 bg-slate-900 p-4 rounded-xl max-w-lg w-full flex flex-col items-center space-y-3 shadow-[0_0_30px_rgba(168,85,247,0.3)]">
            <h4 id="video-title" class="text-xs font-bold text-purple-300">TITLE</h4>
            <video id="modal-video" controls class="w-full max-h-[320px] rounded border border-purple-500/30 bg-black">
                <source src="" type="video/mp4">
                เบราว์เซอร์ของคุณไม่รองรับการเล่นวิดีโอนี้
            </video>
            <button onclick="closeVideoModal()" class="w-full bg-purple-600 hover:bg-purple-500 text-white font-bold py-2 text-xs rounded transition-colors cursor-pointer">ปิดหน้าต่าง</button>
        </div>
    </div>

    <script>
        function openVideoModal(src, title) {
            const vid = document.getElementById('modal-video');
            vid.src = src;
            document.getElementById('video-title').innerText = title;
            document.getElementById('video-modal').classList.remove('hidden');
            vid.play();
        }
        function closeVideoModal() {
            const vid = document.getElementById('modal-video');
            vid.pause();
            vid.src = "";
            document.getElementById('video-modal').classList.add('hidden');
        }
    </script>
</body>
</html>
