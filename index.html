<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memory Puzzle</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<!-- กำหนดให้รูปภาพเป็นพื้นหลังเฉพาะหน้า login นี้ -->
<body class="h-screen w-screen overflow-hidden flex flex-col justify-end items-end p-12 lg:p-20 relative select-none" style="background: url('ปก.png') no-repeat center center fixed; background-size: cover;">
    
    <!-- ฟิลเตอร์หน้าจอ CRT โบราณ -->
    <div class="fixed inset-0 crt-overlay z-50 pointer-events-none"></div>

    <!-- 🎛️ โซนปุ่มกดด้านขวา (Play & Profile Dev) จัดวางให้รับกับพื้นที่ว่างในรูปภาพ -->
    <div class="relative z-10 flex flex-col items-end space-y-4 mr-4 lg:mr-12 mb-8">
        
        <!-- ปุ่ม Play -->
        <button onclick="startGame()" class="w-64 lg:w-72 py-4 bg-blue-600/80 hover:bg-blue-500 text-white font-bold rounded-full shadow-[0_0_25px_rgba(37,99,235,0.7)] hover:shadow-[0_0_35px_rgba(59,130,246,0.9)] border border-blue-400/40 transition-all duration-300 transform hover:scale-105 flex items-center justify-center space-x-3 cursor-pointer backdrop-blur-sm">
            <i class="fa-solid fa-play text-cyan-200"></i>
            <span class="text-xl tracking-widest uppercase font-mono">Play</span>
        </button>

    </div>

    <script src="script.js"></script>
</body>
</html>
