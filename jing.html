        function filterCategory(cat) {
            const buttons = document.querySelectorAll('.nav-btn');
            buttons.forEach(btn => {
                btn.className = "nav-btn px-3 py-1 rounded text-slate-400 hover:bg-slate-800 hover:text-white transition-colors cursor-pointer";
                if(btn.getAttribute('onclick').includes(cat)) {
                    btn.className = "nav-btn px-3 py-1 rounded bg-indigo-600 text-white font-bold transition-colors cursor-pointer";
                }
            });

            if(cat === 'all') {
                renderNews(newsList);
            } else {
                const filtered = newsList.filter(item => item.category === cat);
                renderNews(filtered);
            }
        }

        function renderNews(list) {
            const container = document.getElementById('news-content');
            container.innerHTML = list.map(item => `
                <div onclick="openNewsDetail(${item.id})" class="bg-slate-900/80 border border-slate-800 hover:border-indigo-500/50 p-4 rounded-lg space-y-2 cursor-pointer group transition-all">
                    <div class="flex justify-between items-center">
                        <span class="text-[10px] bg-indigo-500/20 text-indigo-300 border border-indigo-500/30 px-2 py-0.5 rounded">${item.tag}</span>
                        <span class="text-[10px] text-slate-500">${item.date}</span>
                    </div>
                    <h4 class="text-xs font-bold text-white group-hover:text-indigo-400 transition-colors">${item.title}</h4>
                    <p class="text-[11px] text-slate-400 leading-relaxed">${item.shortDesc}</p>
                </div>
            `).join('');
        }

        function openNewsDetail(id) {
            const item = newsList.find(n => n.id === id);
            if(!item) return;

            document.getElementById('modal-tag').innerText = item.tag;
            document.getElementById('modal-date').innerText = item.date;
            document.getElementById('modal-title').innerText = item.title;
            document.getElementById('modal-desc').innerText = item.fullDesc;

            document.getElementById('news-modal').classList.remove('hidden');
        }

        function closeNewsModal() {
            document.getElementById('news-modal').classList.add('hidden');
        }

        // เริ่มต้นแสดงข่าวทั้งหมด
        renderNews(newsList);
    </script>
</body>
</html>
